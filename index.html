<title>Bolo Talk Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen communication device — message strip on top, always-visible quick answers, scrolling symbol grid colour-coded by the Modified Fitzgerald Key. */
:root {
  --bg: #E9EDF1;
  --surface: #FFFFFF;
  --surface-2: #F4F6F9;
  --ink: #111C2A;
  --muted: #56647A;
  --line: #CDD5DF;
  --accent: #1D43B0;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE4FA;
  --danger: #C4211E;
  --danger-ink: #FFFFFF;
  --focus: #F2A900;
  /* Modified Fitzgerald Key: tint / edge */
  --p-t: #FFF3BF; --p-e: #D9A900;
  --v-t: #DAF1D5; --v-e: #2C9A3B;
  --d-t: #D7E5FA; --d-e: #2E6CD2;
  --n-t: #FFE2C4; --n-e: #DD7415;
  --s-t: #FADBEA; --s-e: #C73A80;
  --q-t: #E7DCF8; --q-e: #7A4AC9;
  --x-t: #FAD8D8; --x-e: #CF2E2E;
  --font: "Atkinson Hyperlegible", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-hi: "Noto Sans Devanagari", "Atkinson Hyperlegible", system-ui, sans-serif;
  --tile: 98px;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141C; --surface: #18212C; --surface-2: #121A23; --ink: #EEF2F7; --muted: #9AA8BA; --line: #2B3848;
    --accent: #7E9CFF; --accent-ink: #0B1330; --accent-soft: #1E2B55; --danger: #FF5A52; --danger-ink: #1A0000; --focus: #FFC940;
    --p-t: #332C0E; --p-e: #E8C21E; --v-t: #14301A; --v-e: #4CC45C; --d-t: #132744; --d-e: #5B95F0;
    --n-t: #3A2410; --n-e: #F0923A; --s-t: #3A1529; --s-e: #EE66AA; --q-t: #2A1D45; --q-e: #A47AF0; --x-t: #3D1414; --x-e: #F25555;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141C; --surface: #18212C; --surface-2: #121A23; --ink: #EEF2F7; --muted: #9AA8BA; --line: #2B3848;
  --accent: #7E9CFF; --accent-ink: #0B1330; --accent-soft: #1E2B55; --danger: #FF5A52; --danger-ink: #1A0000; --focus: #FFC940;
  --p-t: #332C0E; --p-e: #E8C21E; --v-t: #14301A; --v-e: #4CC45C; --d-t: #132744; --d-e: #5B95F0;
  --n-t: #3A2410; --n-e: #F0923A; --s-t: #3A1529; --s-e: #EE66AA; --q-t: #2A1D45; --q-e: #A47AF0; --x-t: #3D1414; --x-e: #F25555;
  color-scheme: dark;
}
.hc {
  --line: var(--ink);
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.hi, [lang="hi"] { font-family: var(--font-hi); }

#app { height: 100%; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; padding-inline: 12px; padding-block: 8px 10px; gap: 8px; }

/* Top bar */
.top { display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: baseline; gap: 6px; margin-right: auto; min-width: 0; }
.brand b { font-size: 1.35rem; letter-spacing: -0.01em; }
.brand span { font-family: var(--font-hi); color: var(--muted); font-size: 1.05rem; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-weight: 700; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.icon-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 40px; height: 40px; display: inline-grid; place-items: center; padding: 0 10px; font-weight: 700; }
.help-btn { background: var(--danger); color: var(--danger-ink); border: 0; border-radius: 999px; height: 40px; padding: 0 16px; font-weight: 700; letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 6px; }
.help-btn svg { width: 18px; height: 18px; }

/* Message strip */
.strip { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); display: flex; gap: 8px; padding: 8px; align-items: stretch; }
.msg { flex: 1; min-width: 0; min-height: 64px; display: flex; flex-wrap: wrap; align-content: center; gap: 6px; padding: 4px; overflow-y: auto; max-height: 132px; }
.msg .ph { color: var(--muted); font-size: 1.05rem; padding-left: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 4px 9px; font-size: 1.2rem; font-weight: 700; }
.chip img { width: 24px; height: 24px; border-radius: 6px; object-fit: cover; }
.chip .e { font-size: 1.1rem; }
.strip-actions { display: grid; grid-template-columns: auto auto; gap: 6px; flex-shrink: 0; }
.speak { grid-row: span 2; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 0 18px; font-size: 1.15rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 88px; }
.speak svg { width: 26px; height: 26px; }
.sa { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 10px; min-width: 48px; min-height: 44px; font-weight: 700; display: grid; place-items: center; padding: 0 8px; }
.sa svg { width: 22px; height: 22px; }

/* Quick answers */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.qb { border: 0; border-radius: 12px; min-height: 52px; font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px; }
.qb.yes { background: var(--v-t); box-shadow: inset 0 -4px 0 var(--v-e); }
.qb.no { background: var(--x-t); box-shadow: inset 0 -4px 0 var(--x-e); }
.qb.idk { background: var(--q-t); box-shadow: inset 0 -4px 0 var(--q-e); }
.qb.wait { background: var(--d-t); box-shadow: inset 0 -4px 0 var(--d-e); }

/* Modes + categories */
.modes { display: flex; gap: 6px; }
.modes button { flex: 1; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 40px; font-weight: 700; }
.modes button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; flex-shrink: 0; }
.cat { flex-shrink: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; min-height: 40px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.cat[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.cat.edit[aria-pressed="true"] { background: var(--focus); color: #1A1300; border-color: var(--focus); }
.grid-wrap { flex: 1; min-height: 0; overflow-y: auto; border-radius: var(--r); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr)); gap: 8px; padding-bottom: 12px; }

/* Tiles */
.tile { position: relative; border: 0; border-radius: var(--r); background: var(--surface); min-height: var(--tile); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px 10px; box-shadow: inset 0 0 0 1.5px var(--line); transition: transform .08s; }
.tile:active { transform: scale(0.96); }
.tile .sym { font-size: calc(var(--tile) * 0.36); line-height: 1.1; }
.tile .sym img { width: calc(var(--tile) * 0.5); height: calc(var(--tile) * 0.5); border-radius: 10px; object-fit: cover; display: block; }
.tile .lab { font-weight: 700; font-size: calc(var(--tile) * 0.165); line-height: 1.15; text-align: center; overflow-wrap: break-word; hyphens: auto; max-width: 100%; }
.tile:not(.phrase) .lab.long { font-size: calc(var(--tile) * 0.13); }
.tile .sub { font-size: calc(var(--tile) * 0.12); color: var(--muted); line-height: 1.1; text-align: center; }
.tile.phrase { grid-column: span 2; flex-direction: row; justify-content: flex-start; text-align: left; gap: 10px; padding: 10px 12px; }
.tile.phrase .sym { font-size: calc(var(--tile) * 0.3); flex-shrink: 0; }
.tile.phrase .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile.phrase .lab, .tile.phrase .sub { text-align: left; }
.tile.phrase .lab { font-size: calc(var(--tile) * 0.16); }
.t-p { background: var(--p-t); box-shadow: inset 0 5px 0 var(--p-e); }
.t-v { background: var(--v-t); box-shadow: inset 0 5px 0 var(--v-e); }
.t-d { background: var(--d-t); box-shadow: inset 0 5px 0 var(--d-e); }
.t-n { background: var(--n-t); box-shadow: inset 0 5px 0 var(--n-e); }
.t-s { background: var(--s-t); box-shadow: inset 0 5px 0 var(--s-e); }
.t-q { background: var(--q-t); box-shadow: inset 0 5px 0 var(--q-e); }
.t-x { background: var(--x-t); box-shadow: inset 0 5px 0 var(--x-e); }
.tile.phrase.t-s, .tile.phrase.t-p, .tile.phrase.t-v, .tile.phrase.t-d, .tile.phrase.t-n, .tile.phrase.t-q, .tile.phrase.t-x { box-shadow: inset 5px 0 0 var(--edge, var(--s-e)); }
.tile.phrase.t-p { --edge: var(--p-e); } .tile.phrase.t-v { --edge: var(--v-e); } .tile.phrase.t-d { --edge: var(--d-e); } .tile.phrase.t-n { --edge: var(--n-e); } .tile.phrase.t-q { --edge: var(--q-e); } .tile.phrase.t-x { --edge: var(--x-e); }
.hc .tile { outline: 2px solid var(--ink); outline-offset: -2px; }
.tile.add { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); border: 0; color: var(--muted); }
.editing .tile:not(.add)::after { content: "Edit"; position: absolute; top: 6px; right: 6px; font-size: 11px; font-weight: 700; background: var(--ink); color: var(--bg); padding: 1px 6px; border-radius: 6px; }
.tile.flash { animation: flash .35s; }
@keyframes flash { 0% { filter: brightness(1.25); } 100% { filter: none; } }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 24px 8px; text-align: center; }

/* Type view */
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
#typeBox { width: 100%; min-height: 110px; resize: vertical; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font-size: 1.35rem; background: var(--surface-2); line-height: 1.35; }
.preds { display: flex; gap: 6px; flex-wrap: wrap; min-height: 46px; }
.pred { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; font-size: 1.1rem; font-weight: 700; min-height: 44px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 16px; font-weight: 700; min-height: 46px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { background: var(--danger); color: var(--danger-ink); border-color: var(--danger); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 0.95rem; }
h2 { font-size: 1rem; margin: 0; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.saved { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }

/* Pain view */
.body-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.opt { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; min-height: 52px; padding: 6px 8px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.opt .e { font-size: 1.4rem; }
.opt small { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
.lvl { border: 0; border-radius: 10px; min-height: 56px; font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #111; }
.lvl[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 2px; }
.scale-labels { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }
.pain-out { font-size: 1.2rem; font-weight: 700; background: var(--surface-2); border-radius: 12px; padding: 12px; border: 1.5px dashed var(--line); }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; }
.sheet-bg { background: color-mix(in srgb, var(--ink) 45%, transparent); align-items: center; justify-content: flex-end; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 640px; max-height: 100%; overflow-y: auto; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .sheet-bg { justify-content: center; } }
.sheet h3 { margin: 0; font-size: 1.35rem; }
.sheet p { margin: 0; color: var(--muted); max-width: 65ch; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-weight: 700; font-size: 0.95rem; }
.field .hint { color: var(--muted); font-size: 0.85rem; }
.field input[type="text"], .field input[type="tel"], .field textarea, .field select { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
.field input[type="range"] { width: 100%; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; font-weight: 700; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.sec { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1.5px solid var(--line); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .two { grid-template-columns: 1fr; } }
.key { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.key span { border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 0.9rem; }
.notice { background: var(--p-t); border-left: 5px solid var(--p-e); padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; color: var(--ink); }

#show { background: var(--surface); color: var(--ink); z-index: 60; }
#show .bar, #sos .bar { display: flex; gap: 8px; justify-content: flex-end; padding: 12px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
#showText { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px 24px 40px; font-weight: 700; line-height: 1.12; overflow: hidden; overflow-wrap: anywhere; transition: transform .3s; }
#showText.flip { transform: rotate(180deg); }
#sos { background: var(--danger); color: var(--danger-ink); z-index: 70; }
#sos .bar .btn { background: color-mix(in srgb, var(--danger-ink) 14%, transparent); border-color: color-mix(in srgb, var(--danger-ink) 40%, transparent); color: var(--danger-ink); }
.sos-body { flex: 1; overflow-y: auto; padding: 8px 20px 32px; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; justify-content: center; }
.sos-big { font-size: clamp(2.4rem, 10vw, 5.5rem); font-weight: 700; line-height: 1.05; margin: 0; }
.sos-hi { font-family: var(--font-hi); font-size: clamp(2rem, 8vw, 4.5rem); font-weight: 700; line-height: 1.2; margin: 0; }
.sos-info { font-size: clamp(1.1rem, 4vw, 1.6rem); max-width: 40ch; display: flex; flex-direction: column; gap: 6px; }
.sos-info .num { font-size: clamp(1.6rem, 7vw, 2.6rem); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; user-select: all; }

#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 90; max-width: calc(100% - 32px); text-align: center; }

/* Switch scanning */
#catcher { position: fixed; inset: 0; z-index: 40; background: transparent; }
#catcher .stop { position: absolute; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; overflow: hidden; }
#catcher .stop i { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--focus); }
#catcher .stop.holding i { width: 100%; transition: width 2s linear; }
.scan-g { outline: 4px solid var(--focus) !important; outline-offset: 1px; }
.scan-i { outline: 6px solid var(--focus) !important; outline-offset: 2px; transform: scale(1.04); z-index: 2; }

@media (max-width: 520px) {
  .brand span { display: none; }
  .help-btn .lbl { display: none; }
  .help-btn { padding: 0 12px; }
  .speak { min-width: 74px; padding: 0 12px; }
  .qb { font-size: 1rem; min-height: 48px; }
  .scale { grid-template-columns: repeat(6, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

const tokenize = s => (s.match(/[\p{L}\p{M}\p{N}']+/gu) || []);

    S.learned.w[w] = (S.learned.w[w] || 0) + 1;
    if (i > 0) { const k = toks[i - 1]; (S.learned.b[k] ||= {})[w] = (S.learned.b[k][w] || 0) + 1; }

  if (prev && S.learned.b[prev]) for (const [w, c] of Object.entries(S.learned.b[prev])) if (w.startsWith(partial)) add(w, 50 + c * 20);
  for (const [w, c] of Object.entries(S.learned.w)) if (w.startsWith(partial) && w !== partial) add(w, c * 6);
  if (partial || !prev) for (const w of LEX) if (w.startsWith(partial) && w !== partial) add(w, Math.max(1, 30 - LEXRANK[w] / 12));

    if (!$('#sheetWrap').hidden) closeSheet();
    else if (!$('#show').hidden) $('#showClose').click();
    else if (!$('#sos').hidden) $('#sosClose').click();
  }
});
const field = (id, lab, input, hint) => el('div', { class: 'field' }, el('label', { for: id, text: lab }), input, hint ? el('span', { class: 'hint', text: hint }) : null);
const checkbox = (id, lab, checked, on) => el('label', { class: 'check', for: id }, el('input', { type: 'checkbox', id, checked: !!checked, onchange: e => on(e.target.checked) }), lab);
const selectEl = (id, opts, val, on) => { const s = el('select', { id, onchange: e => on(e.target.value) }); for (const [v, t] of opts) s.append(el('option', { value: v, selected: v === val, text: t })); return s; };

function fillVoiceSelect() {
  for (const lang of ['en', 'hi']) {
    const s = document.getElementById('set-voice-' + lang); if (!s) continue;
    const list = voicesFor(lang);
    s.replaceChildren(el('option', { value: '', text: list.length ? 'Automatic' : 'No voice installed' }));
    for (const v of list) s.append(el('option', { value: v.name, selected: v.name === S.voice[lang], text: `${v.name} (${v.lang})` }));
  }
  const n = document.getElementById('hiVoiceNote');
  if (n) n.hidden = !!voicesFor('hi').length || !voices.length;
}

      el('p', { class: 'notice', id: 'hiVoiceNote', hidden: true, text: 'This device has no Hindi voice yet. On Android, open Settings → Text-to-speech → Google speech engine → Install voice data → Hindi. On iPhone, open Settings → Accessibility → Spoken Content → Voices → Hindi.' }),
      el('div', { class: 'two' },
        field('set-rate', 'Speed', el('input', { type: 'range', id: 'set-rate', min: '0.5', max: '1.5', step: '0.05', value: S.rate, onchange: e => { S.rate = +e.target.value; save(); speak(L() === 'hi' ? 'यह गति कैसी है?' : 'How is this speed?'); } })),
        field('set-pitch', 'Pitch', el('input', { type: 'range', id: 'set-pitch', min: '0.5', max: '1.6', step: '0.05', value: S.pitch, onchange: e => { S.pitch = +e.target.value; save(); speak(L() === 'hi' ? 'यह आवाज़ कैसी है?' : 'How does this sound?'); } }))),
      field('set-g', 'Hindi sentences speak as', selectEl('set-g', [['m', 'Male (मैं थक गया हूँ)'], ['f', 'Female (मैं थक गई हूँ)']], S.g, v => { S.g = v; save(); renderAll(); }), 'Hindi verbs change with the speaker’s gender, so phrases like “I am tired” are spoken correctly.'),
      checkbox('set-tap', 'Speak each word when tapped', S.speakOnTap, v => { S.speakOnTap = v; save(); })
    );
    const look = el('div', { class: 'sec' },
      el('h2', { text: 'Display' }),
      field('set-tile', 'Tile size', selectEl('set-tile', [['s', 'Small – more words'], ['m', 'Medium'], ['l', 'Large'], ['xl', 'Extra large – easier to hit']], S.tile, v => { S.tile = v; save(); applyLook(); })),
      checkbox('set-dual', 'Show the other language under each word', S.dual, v => { S.dual = v; save(); renderAll(); }),
      checkbox('set-hc', 'High-contrast tile borders', S.hc, v => { S.hc = v; save(); applyLook(); })
    );
    const access = el('div', { class: 'sec' },
      el('h2', { text: 'Switch scanning' }),
      el('p', { text: 'For people who cannot tap precisely. Bolo highlights one row at a time, then one tile at a time. Press a switch, the space bar, or tap anywhere on the screen to choose. A Bluetooth switch that acts as a keyboard works too.' }),
      field('set-scan', 'Scan speed', selectEl('set-scan', [['0.8', 'Fast (0.8 s)'], ['1.2', '1.2 s'], ['1.5', 'Medium (1.5 s)'], ['2', '2 s'], ['3', 'Slow (3 s)']], String(S.scanSpeed), v => { S.scanSpeed = +v; save(); })),
      el('button', { class: 'btn primary', onclick: () => { closeSheet(); startScan(); } }, 'Start scanning')
    );
    const sosInput = (k, lab, ph, type = 'text') => field('sos-' + k, lab, el('input', { type, id: 'sos-' + k, value: S.sos[k], placeholder: ph, oninput: e => { S.sos[k] = e.target.value.trim(); save(); } }));
    const sos = el('div', { class: 'sec' },
      el('h2', { text: 'Emergency screen' }),
      el('p', { text: 'Shown in large text when the red Help button is pressed. Bolo does not call anyone; it shows this to the people nearby.' }),
      el('div', { class: 'two' }, sosInput('name', 'Name', 'e.g. Ravi Kumar'), sosInput('contact', 'Emergency phone number', 'e.g. 98xxxxxx10', 'tel')),
      sosInput('why', 'Why I cannot speak', 'e.g. I have ALS. I can hear and understand you.'),
      sosInput('notes', 'Medical notes', 'e.g. Diabetic. Allergic to penicillin.')
    );
    const data = el('div', { class: 'sec' },
      el('h2', { text: 'Your board' }),
      el('p', { text: 'Your words, photos and settings stay on this device only. Copy a backup to move them to another phone or keep them safe.' }),
      el('div', { class: 'row' },
        el('button', { class: 'btn', onclick: copyBackup }, 'Copy backup'),
        el('button', { class: 'btn', onclick: openRestore }, 'Restore backup'),
        el('button', { class: 'btn', onclick: () => { S.hidden = []; save(); renderGrid(); toast('Hidden tiles are back'); } }, 'Show hidden tiles'),
        el('button', { class: 'btn', onclick: () => { S.learned = { w: {}, b: {} }; S.recent = []; save(); renderAll(); toast('Suggestions and recent messages cleared'); } }, 'Clear history'))
    );
    sh.append(voice, look, access, sos, data, el('div', { class: 'row' }, el('button', { class: 'btn primary', onclick: closeSheet }, 'Done')));
    fillVoiceSelect();
  });
}
$('#btnSettings').addEventListener('click', openSettings);

function copyBackup() {
  const data = JSON.stringify({ app: 'bolo', v: 1, state: S });
  const done = () => toast('Backup copied. Paste it into a note or message to keep it.', 3500);
  const fallback = () => {
    openSheet('backup', sh => {
      const ta = el('textarea', { id: 'backupText', rows: '8', readonly: true, style: 'width:100%;font-size:12px' }); ta.value = data;
      sh.append(el('h3', { text: 'Backup' }), el('p', { text: 'Select all of this text and copy it somewhere safe.' }), ta, el('div', { class: 'row' }, el('button', { class: 'btn primary', onclick: closeSheet }, 'Done')));
      ta.focus(); ta.select();
    });
  };
  try { navigator.clipboard.writeText(data).then(done, fallback); } catch (e) { fallback(); }
}
function openRestore() {
  openSheet('restore', sh => {
    const ta = el('textarea', { id: 'restoreText', rows: '6', placeholder: 'Paste your backup here', style: 'width:100%' });
    const file = el('input', { type: 'file', id: 'restoreFile', accept: '.json,.txt,application/json,text/plain', onchange: e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => (ta.value = r.result); r.readAsText(f); } });
    const msg = el('p', { class: 'notice', hidden: true });
    sh.append(el('h3', { text: 'Restore backup' }), el('p', { text: 'This replaces the words, photos and settings on this device.' }),
      field('restoreText', 'Backup text', ta), field('restoreFile', 'Or choose a backup file', file), msg,
      el('div', { class: 'row' },
        el('button', { class: 'btn primary', onclick: () => {
          try {
            const d = JSON.parse(ta.value.trim());
            if (!d || d.app !== 'bolo' || !d.state) throw new Error();
            S = merge(structuredClone(DEFAULT_STATE), d.state); save(); closeSheet(); setLang(S.lang); toast('Backup restored');
          } catch (e) { msg.hidden = false; msg.textContent = 'That text is not a Bolo backup. Copy the whole backup, starting with {"app":"bolo".'; }
        } }, 'Restore'),
        el('button', { class: 'btn', onclick: closeSheet }, 'Cancel')));
  });
}

/* Tile editor */
async function readPhoto(file) {
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const s = 192, c = document.createElement('canvas'); c.width = c.height = s;
  const m = Math.min(img.width, img.height);
  c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
  return c.toDataURL('image/jpeg', 0.8);
}
function openEditor(tile) {
  const isNew = !tile;
  const t = tile ? { ...tile } : { e: '⭐', en: '', hi: '', t: cat === 'phrases' || cat === 'mine' ? 's' : 'n', phrase: cat === 'phrases' || cat === 'mine' };
  let img = t.img || '';
  openSheet('editor', sh => {
    const preview = el('div', { class: 'grid', style: '--tile:110px;max-width:260px' });
    const draw = () => { preview.replaceChildren(tileNode({ ...t, img, id: 'preview' })); preview.firstChild.disabled = true; };
    const inp = (k, lab, ph, hint) => field('ed-' + k, lab, el('input', { type: 'text', id: 'ed-' + k, value: t[k] || '', placeholder: ph, class: k.startsWith('hi') ? 'hi' : '', oninput: e => { t[k] = e.target.value; draw(); } }), hint);
    sh.append(el('h3', { text: isNew ? 'Add a tile' : 'Edit tile' }), preview,
      el('div', { class: 'two' }, inp('en', 'English word or phrase', 'e.g. Grandma Asha'), inp('hi', 'Hindi word or phrase', 'e.g. आशा दादी')),
      el('div', { class: 'two' },
        inp('e', 'Symbol (emoji)', '⭐', 'Or use a photo below.'),
        field('ed-type', 'Colour group', selectEl('ed-type', Object.entries(TYPES).map(([k, v]) => [k, `${v.en} – ${v.c}`]), t.t, v => { t.t = v; draw(); }))),
      field('ed-photo', 'Photo (a real person, food or place works best)', el('input', { type: 'file', id: 'ed-photo', accept: 'image/*', onchange: async e => { const f = e.target.files[0]; if (!f) return; try { img = await readPhoto(f); draw(); } catch (err) { toast('That image could not be read. Try a JPG or PNG.'); } } })),
      img ? el('button', { class: 'btn small', onclick: e => { img = ''; e.target.remove(); draw(); } }, 'Remove photo') : null,
      checkbox('ed-phrase', 'Speak as a whole sentence (wide tile)', t.phrase, v => { t.phrase = v; draw(); }),
      el('div', { class: 'row' },
        el('button', { class: 'btn primary', onclick: () => {
          if (!t.en.trim() && !t.hi.trim()) { toast('Add a word in English or Hindi'); return; }
          const rec = { e: t.e, en: t.en.trim(), hi: t.hi.trim(), hiF: t.hiF || '', t: t.t, phrase: !!t.phrase, img };
          if (tile && tile.def) { S.over[tile.id] = { ...rec, hiF: rec.hi === BYID[tile.id].hi ? BYID[tile.id].hiF : '' }; }
          else if (tile) { const list = S.custom[cat] || []; const i = list.findIndex(x => x.id === tile.id); if (i > -1) list[i] = { ...list[i], ...rec }; }
          else { (S.custom[cat] ||= []).push({ id: 'c' + Date.now(), ...rec }); }
          save(); closeSheet(); renderGrid(); toast('Saved');
        } }, 'Save'),
        tile && tile.def ? el('button', { class: 'btn', onclick: () => { S.hidden.push(tile.id); save(); closeSheet(); renderGrid(); toast('Tile hidden. Settings → Show hidden tiles brings it back.'); } }, 'Hide tile') : null,
        tile && tile.def && S.over[tile.id] ? el('button', { class: 'btn', onclick: () => { delete S.over[tile.id]; save(); closeSheet(); renderGrid(); } }, 'Reset to original') : null,
        tile && !tile.def ? el('button', { class: 'btn danger', onclick: () => { S.custom[cat] = (S.custom[cat] || []).filter(x => x.id !== tile.id); save(); closeSheet(); renderGrid(); if (mode === 'type') renderSaved(); toast('Tile deleted'); } }, 'Delete tile') : null,
        el('button', { class: 'btn', onclick: closeSheet }, 'Cancel')));
    draw();
  });
}

/* About */

      el('div', { class: 'sec' }, el('h2', { text: 'How to use it' }),
        el('p', { text: '1. Tap tiles to build a message, then press Speak. 2. Yes, No, Don’t know and Wait speak instantly. 3. Pain mode builds a full description for doctors and nurses. 4. Show puts the message in huge text; Flip turns it to face the person opposite you. 5. Hold the delete key to clear the whole message. 6. Build a sentence in English, switch to Hindi, and the same message speaks in Hindi.' })),
      el('div', { class: 'sec' }, el('h2', { text: 'Colour key' }),
        el('p', { text: 'Tiles use the Modified Fitzgerald Key, the colour system speech therapists use on communication boards, so skills carry over between boards.' }),
        el('div', { class: 'key' }, ...Object.entries(TYPES).map(([k, v]) => el('span', { class: 't-' + k, text: v.en })))),
      el('div', { class: 'sec' }, el('h2', { text: 'Privacy' }),
        el('p', { text: 'No account, no ads, no tracking. Everything you add stays on this device. Speech uses the voices built into your phone.' })),
      el('div', { class: 'sec' }, el('h2', { text: 'Good to know' }),
        el('p', { text: 'Bolo is a communication aid, not a medical device. In an emergency, it shows your details to people nearby but cannot call anyone. A speech-language therapist can help choose and teach the right vocabulary.' })),

$('#btnAbout').addEventListener('click', openAbout);

/* ---------------- Switch scanning ---------------- */
const scan = { on: false, level: 0, groups: [], gi: -1, ii: -1, timer: null, loops: 0 };
function visible(n) { const r = n.getBoundingClientRect(); return r.width > 0 && r.height > 0 && !n.closest('[hidden]'); }
function buildGroups() {
  const g = [];
  g.push([$('#btnSos'), ...document.querySelectorAll('.qb')]);
  g.push([...document.querySelectorAll('.strip-actions button')]);
  g.push([...document.querySelectorAll('.modes button')]);
  const view = $('#view-' + mode);
  if (mode === 'board') {
    g.push([...document.querySelectorAll('#cats .cat:not(.edit)')]);
    const rows = new Map();
    document.querySelectorAll('#grid .tile').forEach(t => { const k = t.offsetTop; if (!rows.has(k)) rows.set(k, []); rows.get(k).push(t); });
    for (const r of rows.values()) g.push(r);
  } else {
    const rows = new Map();
    view.querySelectorAll('button').forEach(t => { if (!visible(t)) return; const k = Math.round(t.getBoundingClientRect().top + view.querySelector('.scroll').scrollTop); if (!rows.has(k)) rows.set(k, []); rows.get(k).push(t); });
    [...rows.entries()].sort((a, b) => a[0] - b[0]).forEach(([, r]) => g.push(r));
  }
  return g.filter(x => x.length);
}
function clearHi() { document.querySelectorAll('.scan-g,.scan-i').forEach(n => n.classList.remove('scan-g', 'scan-i')); }
function scanTick() {
  clearHi();
  if (scan.level === 0) {
    scan.gi = (scan.gi + 1) % scan.groups.length;
    const grp = scan.groups[scan.gi];
    grp.forEach(n => n.classList.add('scan-g'));
    grp[0].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } else {
    const grp = scan.groups[scan.gi];
    scan.ii++;
    if (scan.ii >= grp.length) { scan.ii = 0; scan.loops++; if (scan.loops >= 2) { scan.level = 0; scan.gi--; return scanTick(); } }
    grp[scan.ii].classList.add('scan-i');
    grp[scan.ii].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}
function restartTimer() { clearInterval(scan.timer); scan.timer = setInterval(scanTick, S.scanSpeed * 1000); }
function scanSelect() {
  if (!$('#show').hidden) { $('#showClose').click(); return; }
  if (!$('#sos').hidden) { $('#sosClose').click(); return; }
  if (scan.gi < 0) return;
  if (scan.level === 0) {
    const grp = scan.groups[scan.gi];
    if (grp.length === 1) { activate(grp[0]); return; }
    scan.level = 1; scan.ii = -1; scan.loops = 0; scanTick(); restartTimer();
  } else {
    const item = scan.groups[scan.gi][scan.ii];
    activate(item);
  }
}
function activate(n) {
  clearHi(); n.click();
  scan.level = 0; scan.gi = -1;
  setTimeout(() => { scan.groups = buildGroups(); scanTick(); restartTimer(); }, 150);
}
function startScan() {
  scan.on = true; scan.level = 0; scan.gi = -1; scan.groups = buildGroups();
  $('#catcher').hidden = false; scanTick(); restartTimer();
  toast('Scanning. Tap anywhere or press space to choose.', 3500);
}
function stopScan() { scan.on = false; clearInterval(scan.timer); clearHi(); $('#catcher').hidden = true; toast('Scanning stopped'); }
$('#catcher').addEventListener('pointerdown', e => { if (e.target.closest('#scanStop')) return; e.preventDefault(); scanSelect(); });
let stopHold;
const stopBtn = $('#scanStop');
stopBtn.addEventListener('pointerdown', e => { e.stopPropagation(); stopBtn.classList.add('holding'); stopHold = setTimeout(stopScan, 2000); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => stopBtn.addEventListener(ev, () => { stopBtn.classList.remove('holding'); clearTimeout(stopHold); }));
document.addEventListener('keydown', e => {
  if (!scan.on) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) scanSelect(); }
});

/* ---------------- Start ---------------- */
const hash = location.hash.replace('#', '');
setLang(S.lang);
if (['type', 'pain'].includes(hash)) setMode(hash);
// Opening example so the first screen shows what Bolo does; cleared by the first tap on delete.
if (!S.recent.length) { sentence = [BYID.i, BYID.want, BYID.water, BYID.please].map(t => ({ ...t })); renderMsg(); }
})();
